<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>Meu formulário</title>
</head>

<body>  

<form> 
    <label>Nome do animal</label>
    <input type="text" id="nome">
    <br><br>

    <label>Especie</label>
    <select id="especieAnimal" required>
        
        <option value="">Selecione...</option>
        <option>Cachorro</option>
        <option>Gato</option>
        <option>outro</option>
    </select>

    <label>Raça</label>
    <input type="text" id="nome">
    <br><br>
    <label>Idade</label>
    <input type="number" id="idadeAnimal" min="0">
    <br><br>
    
    <label>Sexo</label>
        <select id="sexoAnimal" required>
        <option value="">Selecione...</option>
        <option>Macho</option>
        <option>femea</option>

       </select>
       <br><br>
       <label>Porte</label>
        <select id="porteAnimal" required>
        <option value="">Selecione...</option>
        <option>Pequeno</option>
        <option>Medio</option>
        <option>Grande</option>
        <option>Gigante</option>
        </select>
       <br><br>

       <label>Descrição</label>
       <textarea id="descricaoAnimal"></textarea>
       <br><br>

       <button class="Salvar">Cadastro Animal</button>

</form>







</body>










</html>
